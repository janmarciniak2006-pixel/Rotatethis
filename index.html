<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Rotator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --border: #2a2a3a;
    --accent: #7c5cfc;
    --accent2: #fc5c8a;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── LEFT PANEL ── */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    padding: 24px 20px;
    gap: 20px;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .logo span { color: var(--accent); }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .section { display: flex; flex-direction: column; gap: 8px; }

  /* Upload */
  #drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(124,92,252,.06);
    color: var(--text);
  }
  #drop-zone .icon { font-size: 28px; margin-bottom: 6px; display: block; }
  #file-input { display: none; }

  /* Controls */
  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .control-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }

  input[type=range] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    cursor: pointer;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .value-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    min-width: 38px;
    text-align: right;
  }

  /* Direction toggle */
  .toggle-group { display: flex; gap: 6px; }
  .toggle-btn {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .toggle-btn.active {
    border-color: var(--accent);
    background: rgba(124,92,252,.15);
    color: var(--accent);
  }

  /* Axis selector */
  .axis-group { display: flex; gap: 6px; }
  .axis-btn {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
  }
  .axis-btn.active {
    border-color: var(--accent2);
    background: rgba(252,92,138,.12);
    color: var(--accent2);
  }

  /* RGB color picker */
  .rgb-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .color-swatch {
    border-radius: 8px;
    height: 44px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .2s, transform .15s;
  }
  .color-swatch:hover { transform: scale(1.06); }
  .color-swatch.selected { border-color: white; }

  .custom-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #custom-color {
    width: 40px; height: 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 2px;
    background: var(--border);
  }
  .custom-color-label { font-size: 12px; color: var(--muted); }

  /* Pause/play */
  #play-btn {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  #play-btn:hover {
    border-color: var(--accent);
    background: rgba(124,92,252,.1);
    color: var(--accent);
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #canvas-wrap canvas, #canvas-wrap #img-view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #img-view {
    display: none;
    align-items: center;
    justify-content: center;
  }

  #img-view img {
    max-width: 60%;
    max-height: 60%;
    image-rendering: auto;
    animation: none;
  }

  #empty-hint {
    text-align: center;
    color: var(--muted);
    pointer-events: none;
    user-select: none;
  }
  #empty-hint .big { font-size: 52px; margin-bottom: 12px; }
  #empty-hint p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside id="sidebar">
  <div class="logo">spin<span>.</span>studio</div>

  <!-- Upload -->
  <div class="section">
    <div class="section-label">Obiekt</div>
    <div id="drop-zone">
      <span class="icon">🖼️</span>
      Przeciągnij PNG lub OBJ/GLB/GLTF<br>
      <small>albo kliknij, by wybrać plik</small>
    </div>
    <input type="file" id="file-input" accept=".png,.jpg,.jpeg,.obj,.glb,.gltf">
  </div>

  <hr class="divider">

  <!-- Speed -->
  <div class="section">
    <div class="section-label">Prędkość</div>
    <div class="control-row">
      <label>Obroty/s</label>
      <input type="range" id="speed" min="0.05" max="5" step="0.05" value="0.5">
      <span class="value-badge" id="speed-val">0.5</span>
    </div>
  </div>

  <hr class="divider">

  <!-- Direction -->
  <div class="section">
    <div class="section-label">Kierunek</div>
    <div class="toggle-group">
      <button class="toggle-btn active" data-dir="1">↻ Prawo</button>
      <button class="toggle-btn" data-dir="-1">↺ Lewo</button>
    </div>
  </div>

  <hr class="divider">

  <!-- Axis (for 3D) -->
  <div class="section" id="axis-section" style="display:none">
    <div class="section-label">Oś obrotu</div>
    <div class="axis-group">
      <button class="axis-btn" data-axis="x">X</button>
      <button class="axis-btn active" data-axis="y">Y</button>
      <button class="axis-btn" data-axis="z">Z</button>
    </div>
  </div>

  <hr class="divider" id="axis-divider" style="display:none">

  <!-- Background color -->
  <div class="section">
    <div class="section-label">Tło</div>
    <div class="rgb-grid" id="swatch-grid"></div>
    <div class="custom-color-row">
      <input type="color" id="custom-color" value="#0a0a0f">
      <span class="custom-color-label">Własny kolor RGB</span>
    </div>
  </div>

  <hr class="divider">

  <!-- Play/Pause -->
  <button id="play-btn">⏸ Zatrzymaj</button>
</aside>

<!-- ── CANVAS ── -->
<div id="canvas-wrap">
  <div id="empty-hint">
    <div class="big">🌀</div>
    <p>Wgraj obiekt PNG lub 3D<br>by zobaczyć animację obrotu.</p>
  </div>

  <!-- 3D canvas -->
  <canvas id="three-canvas" style="display:none"></canvas>

  <!-- 2D image view -->
  <div id="img-view">
    <img id="preview-img" src="" alt="">
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- GLTFLoader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<!-- OBJLoader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  speed: 0.5,
  direction: 1,
  axis: 'y',
  bgColor: '#0a0a0f',
  playing: true,
  mode: 'none', // 'none' | '2d' | '3d'
};

// ── Color swatches ─────────────────────────────────────────────────────────
const SWATCHES = [
  '#0a0a0f','#0d1b2a','#1a0a2e','#0a1f0a',
  '#1a1a2e','#2d0000','#002b36','#1c1c1c',
  '#000428','#0f2027','#203a43','#f0f0f0',
];
const swatchGrid = document.getElementById('swatch-grid');
SWATCHES.forEach(c => {
  const s = document.createElement('div');
  s.className = 'color-swatch' + (c === state.bgColor ? ' selected' : '');
  s.style.background = c;
  s.title = c;
  s.addEventListener('click', () => setBg(c));
  swatchGrid.appendChild(s);
});

function setBg(hex) {
  state.bgColor = hex;
  document.getElementById('custom-color').value = hex;
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('selected', s.style.background === hexToRgbStyle(hex) || s.title === hex);
  });
  document.getElementById('canvas-wrap').style.background = hex;
  if (renderer) renderer.setClearColor(hex, 1);
  document.getElementById('img-view').style.background = hex;
}

function hexToRgbStyle(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

document.getElementById('custom-color').addEventListener('input', e => setBg(e.target.value));

// ── Three.js setup ─────────────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const wrap = document.getElementById('canvas-wrap');
let renderer, scene, camera, mesh3d, animId;

function initThree() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(window.devicePixelRatio);
  resize();
  renderer.setClearColor(state.bgColor, 1);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 1000);
  camera.position.set(0, 1, 4);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(5, 8, 5);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x8888ff, 0.4);
  dir2.position.set(-5, -3, -5);
  scene.add(dir2);

  window.addEventListener('resize', resize);
}

function resize() {
  if (!renderer) return;
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  if (camera) {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
  }
}

let lastTime = null;
function animate3d(ts) {
  animId = requestAnimationFrame(animate3d);
  if (!mesh3d) return;
  if (state.playing) {
    const dt = lastTime ? (ts - lastTime) / 1000 : 0;
    lastTime = ts;
    const delta = state.speed * state.direction * Math.PI * 2 * dt;
    mesh3d.rotation[state.axis] += delta;
  } else {
    lastTime = null;
  }
  renderer.render(scene, camera);
}

// ── 2D Image animation ─────────────────────────────────────────────────────
let imgAnimId = null;
let imgAngle = 0;
let imgLastTime = null;

function animate2d(ts) {
  imgAnimId = requestAnimationFrame(animate2d);
  const img = document.getElementById('preview-img');
  if (state.playing) {
    const dt = imgLastTime ? (ts - imgLastTime) / 1000 : 0;
    imgLastTime = ts;
    imgAngle += state.speed * state.direction * 360 * dt;
    img.style.transform = `rotateY(${imgAngle}deg)`;
  } else {
    imgLastTime = null;
  }
}

// ── File loading ───────────────────────────────────────────────────────────
function loadFile(file) {
  const name = file.name.toLowerCase();

  if (name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
    load2D(file);
  } else if (name.endsWith('.glb') || name.endsWith('.gltf')) {
    load3D(file, 'gltf');
  } else if (name.endsWith('.obj')) {
    load3D(file, 'obj');
  }
}

function load2D(file) {
  stopAll();
  state.mode = '2d';

  document.getElementById('three-canvas').style.display = 'none';
  document.getElementById('empty-hint').style.display = 'none';
  document.getElementById('axis-section').style.display = 'none';
  document.getElementById('axis-divider').style.display = 'none';

  const iv = document.getElementById('img-view');
  iv.style.display = 'flex';
  iv.style.background = state.bgColor;

  const url = URL.createObjectURL(file);
  const img = document.getElementById('preview-img');
  img.src = url;
  img.style.perspective = '600px';
  imgAngle = 0;
  imgAnimId = requestAnimationFrame(animate2d);
}

function load3D(file, type) {
  stopAll();
  state.mode = '3d';

  document.getElementById('img-view').style.display = 'none';
  document.getElementById('empty-hint').style.display = 'none';
  document.getElementById('axis-section').style.display = 'flex';
  document.getElementById('axis-divider').style.display = 'block';

  canvas.style.display = 'block';
  initThree();
  renderer.setClearColor(state.bgColor, 1);

  // Remove old mesh
  if (mesh3d) { scene.remove(mesh3d); mesh3d = null; }

  const url = URL.createObjectURL(file);

  if (type === 'gltf') {
    const loader = new THREE.GLTFLoader();
    loader.load(url, gltf => {
      mesh3d = gltf.scene;
      fitMesh(mesh3d);
      scene.add(mesh3d);
      animId = requestAnimationFrame(animate3d);
    });
  } else {
    const loader = new THREE.OBJLoader();
    loader.load(url, obj => {
      mesh3d = obj;
      // Default material if missing
      mesh3d.traverse(c => {
        if (c.isMesh && !c.material) {
          c.material = new THREE.MeshStandardMaterial({ color: 0xaaaacc });
        }
      });
      fitMesh(mesh3d);
      scene.add(mesh3d);
      animId = requestAnimationFrame(animate3d);
    });
  }
}

function fitMesh(m) {
  const box = new THREE.Box3().setFromObject(m);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 2.5 / maxDim;
  m.scale.setScalar(scale);
  m.position.sub(center.multiplyScalar(scale));
}

function stopAll() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (imgAnimId) { cancelAnimationFrame(imgAnimId); imgAnimId = null; }
  lastTime = null; imgLastTime = null;
}

// ── Controls ───────────────────────────────────────────────────────────────
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speed-val');
speedSlider.addEventListener('input', () => {
  state.speed = parseFloat(speedSlider.value);
  speedVal.textContent = state.speed.toFixed(2);
});

document.querySelectorAll('[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.direction = parseInt(btn.dataset.dir);
    document.querySelectorAll('[data-dir]').forEach(b => b.classList.toggle('active', b === btn));
  });
});

document.querySelectorAll('[data-axis]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.axis = btn.dataset.axis;
    document.querySelectorAll('[data-axis]').forEach(b => b.classList.toggle('active', b === btn));
  });
});

const playBtn = document.getElementById('play-btn');
playBtn.addEventListener('click', () => {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? '⏸ Zatrzymaj' : '▶ Wznów';
});

// ── Drop zone ──────────────────────────────────────────────────────────────
const dz = document.getElementById('drop-zone');
const fi = document.getElementById('file-input');

dz.addEventListener('click', () => fi.click());
fi.addEventListener('change', () => { if (fi.files[0]) loadFile(fi.files[0]); });

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

// init bg
setBg(state.bgColor);
</script>
</body>
</html>
