<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spin.stx</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#000; --text:#fff; --muted:#555; --mono:'Courier New',Courier,monospace; }
body { background:var(--bg); color:var(--text); font-family:var(--mono); font-size:12px; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

#topbar { display:flex; align-items:flex-start; gap:0; padding:10px 16px; border-bottom:1px solid #1a1a1a; flex-shrink:0; position:relative; z-index:10; }
.tb-group { display:flex; flex-direction:column; gap:6px; padding-right:28px; border-right:1px solid #1a1a1a; margin-right:28px; }
.tb-group:last-child { border-right:none; margin-right:0; }
.tb-label { color:var(--text); font-size:11px; }
.tb-sub { color:var(--muted); font-size:11px; cursor:pointer; user-select:none; white-space:nowrap; }
.tb-sub:hover { color:var(--text); }
.tb-sub.active { color:var(--text); }
.tb-range { display:flex; align-items:center; gap:8px; }
input[type=range] { -webkit-appearance:none; width:130px; height:1px; background:#333; cursor:pointer; outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px; border-radius:50%; border:1px solid #666; background:#000; cursor:pointer; }
input[type=range]::-webkit-slider-thumb:hover { border-color:#fff; }
.tb-val { color:var(--muted); min-width:32px; font-size:11px; }

#sidebar { position:absolute; left:0; top:56px; bottom:0; width:72px; padding:14px 0 14px 14px; display:flex; flex-direction:column; gap:12px; z-index:10; pointer-events:none; }
.brand { color:var(--text); font-size:11px; pointer-events:all; }
.sb-item { color:var(--muted); font-size:11px; cursor:pointer; pointer-events:all; user-select:none; }
.sb-item:hover { color:var(--text); }
.sb-item.active { color:var(--text); }

#canvas-wrap { flex:1; position:relative; overflow:hidden; cursor:default; }
#three-canvas { display:none; position:absolute; inset:0; width:100%; height:100%; }
#img-view { display:none; position:absolute; inset:0; align-items:center; justify-content:center; perspective:800px; }
#preview-img { max-width:50%; max-height:70%; }
#empty-hint { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); gap:8px; pointer-events:none; }
#empty-hint .big { font-size:11px; letter-spacing:.1em; }

.panel { display:none; position:absolute; bottom:20px; left:72px; z-index:20; background:#080808; border:1px solid #222; padding:14px; flex-direction:column; gap:10px; }
.panel.open { display:flex; }
.cp-label { font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
.swatch-row { display:flex; gap:5px; flex-wrap:wrap; }
.swatch { width:22px; height:22px; cursor:pointer; border:1px solid transparent; }
.swatch:hover,.swatch.active { border-color:#fff; }
#custom-color { width:26px; height:26px; border:1px solid #333; background:none; cursor:pointer; padding:1px; }
.cam-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cam-row label { font-size:11px; color:var(--muted); min-width:55px; }

#file-input { display:none; }
#drag-overlay { display:none; position:absolute; inset:0; border:1px solid #333; z-index:30; align-items:center; justify-content:center; font-size:11px; color:var(--muted); letter-spacing:.1em; pointer-events:none; }
#drag-overlay.show { display:flex; }
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-group">
    <span class="tb-label">spin.stx</span>
    <span class="tb-sub" id="btn-load">+ load</span>
  </div>
  <div class="tb-group">
    <span class="tb-label">speed</span>
    <div class="tb-range">
      <input type="range" id="speed" min="0.02" max="5" step="0.02" value="0.4">
      <span class="tb-val" id="speed-val">0.40</span>
    </div>
  </div>
  <div class="tb-group">
    <span class="tb-label">direction</span>
    <div class="tb-range" style="gap:14px">
      <span class="tb-sub active" data-dir="1">→ cw</span>
      <span class="tb-sub" data-dir="-1">← ccw</span>
    </div>
  </div>
  <div class="tb-group" id="axis-group" style="display:none">
    <span class="tb-label">axis</span>
    <div class="tb-range" style="gap:14px">
      <span class="tb-sub" data-axis="x">X</span>
      <span class="tb-sub active" data-axis="y">Y</span>
      <span class="tb-sub" data-axis="z">Z</span>
    </div>
  </div>
  <div class="tb-group">
    <span class="tb-label">zoom</span>
    <div class="tb-range">
      <input type="range" id="zoom" min="1" max="12" step="0.1" value="4">
      <span class="tb-val" id="zoom-val">4.0</span>
    </div>
  </div>
  <div class="tb-group">
    <span class="tb-label">animate</span>
    <span class="tb-sub active" id="btn-play">⏸ pause</span>
  </div>
</div>

<div id="sidebar">
  <span class="brand">spin.stx</span>
  <span class="sb-item" id="sb-load">load</span>
  <span class="sb-item" id="sb-color">color</span>
  <span class="sb-item" id="sb-camera">camera</span>
  <span class="sb-item" id="sb-reset">reset</span>
</div>

<div id="canvas-wrap">
  <canvas id="three-canvas"></canvas>
  <div id="img-view"><img id="preview-img" src="" alt=""></div>
  <div id="empty-hint">
    <span class="big">[ spin.stx ]</span>
    <span style="font-size:11px">wgraj PNG, GLB lub OBJ</span>
    <span style="font-size:10px;margin-top:2px">przeciagnij plik tutaj</span>
  </div>
  <div id="drag-overlay">upusc plik</div>
</div>

<div class="panel" id="color-panel">
  <span class="cp-label">background</span>
  <div class="swatch-row" id="swatch-row"></div>
  <div style="display:flex;align-items:center;gap:8px">
    <input type="color" id="custom-color" value="#000000">
    <span style="font-size:10px;color:var(--muted)">custom rgb</span>
  </div>
</div>

<div class="panel" id="cam-panel">
  <span class="cp-label">camera</span>
  <div class="cam-row">
    <label>elevation</label>
    <input type="range" id="cam-elev" min="-80" max="80" step="1" value="10">
    <span class="tb-val" id="cam-elev-val">10deg</span>
  </div>
  <div class="cam-row">
    <label>distance</label>
    <input type="range" id="cam-dist" min="1" max="12" step="0.1" value="4">
    <span class="tb-val" id="cam-dist-val">4.0</span>
  </div>
  <div class="cam-row">
    <label>fov</label>
    <input type="range" id="cam-fov" min="20" max="100" step="1" value="45">
    <span class="tb-val" id="cam-fov-val">45deg</span>
  </div>
  <span style="font-size:10px;color:var(--muted)">drag canvas = orbit | scroll = zoom</span>
</div>

<input type="file" id="file-input" accept=".png,.jpg,.jpeg,.obj,.glb,.gltf">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script>
const S = { speed:0.4, direction:1, axis:'y', bgColor:'#000000', playing:true, mode:'none', camElev:10, camDist:4, camFov:45 };

const cvs = document.getElementById('three-canvas');
const wrap = document.getElementById('canvas-wrap');
let renderer, scene, camera, mesh3d, animId, imgAnimId;
let lastTs=null, imgLastTs=null, imgAngle=0;

function initThree() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({canvas:cvs, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(S.camFov, wrap.clientWidth/wrap.clientHeight, 0.01, 1000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.4); d1.position.set(5,8,5); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x4466ff, 0.3); d2.position.set(-4,-2,-6); scene.add(d2);
  resize(); window.addEventListener('resize', resize);
}

function updateCamera() {
  if (!camera) return;
  camera.fov = S.camFov; camera.updateProjectionMatrix();
  const er = S.camElev * Math.PI / 180;
  camera.position.set(0, Math.sin(er)*S.camDist, Math.cos(er)*S.camDist);
  camera.lookAt(0,0,0);
}

function resize() {
  if (!renderer) return;
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  if (camera) { camera.aspect = wrap.clientWidth/wrap.clientHeight; camera.updateProjectionMatrix(); }
}

function animate3d(ts) {
  animId = requestAnimationFrame(animate3d);
  if (!mesh3d) return;
  if (S.playing) { const dt = lastTs?(ts-lastTs)/1000:0; lastTs=ts; mesh3d.rotation[S.axis] += S.speed*S.direction*Math.PI*2*dt; } else lastTs=null;
  renderer.render(scene, camera);
}

function animate2d(ts) {
  imgAnimId = requestAnimationFrame(animate2d);
  const img = document.getElementById('preview-img');
  if (S.playing) { const dt = imgLastTs?(ts-imgLastTs)/1000:0; imgLastTs=ts; imgAngle += S.speed*S.direction*360*dt; img.style.transform='rotateY('+imgAngle+'deg)'; } else imgLastTs=null;
}

function stopAll() {
  if (animId) cancelAnimationFrame(animId);
  if (imgAnimId) cancelAnimationFrame(imgAnimId);
  animId=imgAnimId=null; lastTs=imgLastTs=null;
}

function loadFile(f) {
  const n = f.name.toLowerCase();
  if (n.match(/\.(png|jpe?g)$/)) load2D(f);
  else if (n.match(/\.(glb|gltf)$/)) load3D(f,'gltf');
  else if (n.endsWith('.obj')) load3D(f,'obj');
}

function load2D(f) {
  stopAll(); S.mode='2d';
  cvs.style.display='none';
  document.getElementById('empty-hint').style.display='none';
  document.getElementById('axis-group').style.display='none';
  const iv=document.getElementById('img-view'); iv.style.display='flex'; iv.style.background=S.bgColor;
  document.getElementById('preview-img').src=URL.createObjectURL(f);
  imgAngle=0; imgAnimId=requestAnimationFrame(animate2d);
}

function load3D(f,type) {
  stopAll(); S.mode='3d';
  document.getElementById('img-view').style.display='none';
  document.getElementById('empty-hint').style.display='none';
  document.getElementById('axis-group').style.display='flex';
  cvs.style.display='block';
  initThree(); renderer.setClearColor(S.bgColor,1);
  if (mesh3d) { scene.remove(mesh3d); mesh3d=null; }
  const url=URL.createObjectURL(f);
  const onLoad = obj => {
    mesh3d = obj.scene||obj;
    mesh3d.traverse(c=>{ if(c.isMesh&&!c.material) c.material=new THREE.MeshStandardMaterial({color:0xaaaacc}); });
    const box=new THREE.Box3().setFromObject(mesh3d), sz=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
    const sc=2.2/Math.max(sz.x,sz.y,sz.z); mesh3d.scale.setScalar(sc); mesh3d.position.sub(ctr.multiplyScalar(sc));
    scene.add(mesh3d); updateCamera(); animId=requestAnimationFrame(animate3d);
  };
  if (type==='gltf') new THREE.GLTFLoader().load(url,onLoad);
  else new THREE.OBJLoader().load(url,onLoad);
}

function setBg(hex) {
  S.bgColor=hex; document.getElementById('custom-color').value=hex;
  wrap.style.background=hex; document.getElementById('img-view').style.background=hex;
  if(renderer) renderer.setClearColor(hex,1);
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.color===hex));
}

const SWATCHES=['#000000','#0a0a0a','#0d0d1a','#001a0d','#1a0000','#0a0a1f','#1a1a00','#ffffff','#0f1923','#1a0f23','#001f1a','#23000f'];
const sr=document.getElementById('swatch-row');
SWATCHES.forEach(c=>{ const s=document.createElement('div'); s.className='swatch'+(c===S.bgColor?' active':''); s.style.background=c; s.dataset.color=c; s.addEventListener('click',()=>setBg(c)); sr.appendChild(s); });
document.getElementById('custom-color').addEventListener('input',e=>setBg(e.target.value));
setBg(S.bgColor);

// camera drag
let isDrag=false, dragSY=0, elevStart=0;
wrap.addEventListener('mousedown',e=>{ if(S.mode!=='3d')return; isDrag=true; dragSY=e.clientY; elevStart=S.camElev; wrap.style.cursor='grabbing'; });
window.addEventListener('mousemove',e=>{ if(!isDrag)return; S.camElev=Math.max(-80,Math.min(80,elevStart-(e.clientY-dragSY)*0.3)); document.getElementById('cam-elev').value=S.camElev; document.getElementById('cam-elev-val').textContent=Math.round(S.camElev)+'deg'; updateCamera(); });
window.addEventListener('mouseup',()=>{ isDrag=false; wrap.style.cursor='default'; });
wrap.addEventListener('wheel',e=>{ if(S.mode!=='3d')return; e.preventDefault(); S.camDist=Math.max(1,Math.min(12,S.camDist+e.deltaY*0.005)); document.getElementById('cam-dist').value=S.camDist; document.getElementById('cam-dist-val').textContent=S.camDist.toFixed(1); document.getElementById('zoom').value=S.camDist; document.getElementById('zoom-val').textContent=S.camDist.toFixed(1); updateCamera(); },{passive:false});

// sliders
document.getElementById('speed').addEventListener('input',e=>{ S.speed=parseFloat(e.target.value); document.getElementById('speed-val').textContent=S.speed.toFixed(2); });
document.getElementById('zoom').addEventListener('input',e=>{ S.camDist=parseFloat(e.target.value); document.getElementById('zoom-val').textContent=S.camDist.toFixed(1); document.getElementById('cam-dist').value=S.camDist; document.getElementById('cam-dist-val').textContent=S.camDist.toFixed(1); updateCamera(); });
document.getElementById('cam-elev').addEventListener('input',e=>{ S.camElev=parseFloat(e.target.value); document.getElementById('cam-elev-val').textContent=Math.round(S.camElev)+'deg'; updateCamera(); });
document.getElementById('cam-dist').addEventListener('input',e=>{ S.camDist=parseFloat(e.target.value); document.getElementById('cam-dist-val').textContent=S.camDist.toFixed(1); document.getElementById('zoom').value=S.camDist; document.getElementById('zoom-val').textContent=S.camDist.toFixed(1); updateCamera(); });
document.getElementById('cam-fov').addEventListener('input',e=>{ S.camFov=parseInt(e.target.value); document.getElementById('cam-fov-val').textContent=S.camFov+'deg'; updateCamera(); });

document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{ S.direction=parseInt(b.dataset.dir); document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('active',x===b)); }));
document.querySelectorAll('[data-axis]').forEach(b=>b.addEventListener('click',()=>{ S.axis=b.dataset.axis; document.querySelectorAll('[data-axis]').forEach(x=>x.classList.toggle('active',x===b)); }));

document.getElementById('btn-play').addEventListener('click',function(){ S.playing=!S.playing; this.textContent=S.playing?'pause':'play'; });

function closePanels() { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open')); }

document.getElementById('sb-load').addEventListener('click',()=>{ closePanels(); document.getElementById('file-input').click(); });
document.getElementById('btn-load').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('sb-color').addEventListener('click',()=>{ const p=document.getElementById('color-panel'); const o=p.classList.contains('open'); closePanels(); if(!o)p.classList.add('open'); });
document.getElementById('sb-camera').addEventListener('click',()=>{ const p=document.getElementById('cam-panel'); const o=p.classList.contains('open'); closePanels(); if(!o)p.classList.add('open'); });
document.getElementById('sb-reset').addEventListener('click',()=>{ if(mesh3d)mesh3d.rotation.set(0,0,0); imgAngle=0; S.camElev=10;S.camDist=4;S.camFov=45; ['cam-elev','cam-dist','cam-fov','zoom'].forEach(id=>document.getElementById(id).value=id==='cam-fov'?45:id==='zoom'||id==='cam-dist'?4:10); document.getElementById('cam-elev-val').textContent='10deg'; document.getElementById('cam-dist-val').textContent='4.0'; document.getElementById('cam-fov-val').textContent='45deg'; document.getElementById('zoom-val').textContent='4.0'; updateCamera(); });

document.getElementById('file-input').addEventListener('change',e=>{ if(e.target.files[0])loadFile(e.target.files[0]); });
const dov=document.getElementById('drag-overlay');
wrap.addEventListener('dragover',e=>{ e.preventDefault(); dov.classList.add('show'); });
wrap.addEventListener('dragleave',()=>dov.classList.remove('show'));
wrap.addEventListener('drop',e=>{ e.preventDefault(); dov.classList.remove('show'); if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]); });
</script>
</body>
</html>
